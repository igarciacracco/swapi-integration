# Registration profile (--spring.profiles.active=postgres). Only accounts need a database.

spring:
  # Clears the default exclusions, re-enabling the JDBC and Flyway auto-configurations.
  autoconfigure:
    exclude:

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/swapi}
    username: ${SPRING_DATASOURCE_USERNAME:swapi}
    password: ${SPRING_DATASOURCE_PASSWORD:swapi}

  flyway:
    enabled: true
    locations: classpath:db/migration
